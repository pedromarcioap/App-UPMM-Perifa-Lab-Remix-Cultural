<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&amp;family=JetBrains+Mono:wght@600;800&amp;display=swap');
      .txt-heavy { font-family: 'Space Grotesk', sans-serif; font-weight: 900; letter-spacing: -0.03em; }
      .txt-mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.16em; font-weight: 700; }
      .txt-stencil { font-family: 'Space Grotesk', sans-serif; font-weight: 900; letter-spacing: 0.04em; }
      .txt-sub { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      .txt-desc { font-family: 'Space Grotesk', sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Fundo Concreto Asfalto Escuro com Toque de Textura Mate -->
  <rect width="1000" height="600" fill="#11100F"/>

  <!-- Padrão Gráfico Streetwear Brutalista (Hachuras diagonais e linhas de demarcação urbana) -->
  <g opacity="0.08" stroke="#FF5722" stroke-width="1.5">
    <line x1="80" y1="0" x2="200" y2="600"/>
    <line x1="160" y1="0" x2="280" y2="600"/>
    <line x1="240" y1="0" x2="360" y2="600"/>
    <line x1="320" y1="0" x2="440" y2="600"/>
  </g>

  <!-- Metadados de Topo -->
  <text x="60" y="44" fill="#FF5722" class="txt-mono" font-size="11">VAR.03 // BRUTALIST MURAL STENCIL [U / P / M / M MODULAR BLOCKS]</text>
  <text x="940" y="44" text-anchor="end" fill="#66625C" class="txt-mono" font-size="11">STREETWEAR MURAL GRID // HEAVY CONTRAST</text>

  <!-- SÍMBOLO ESQUERDA: GLIFO ESTÊNCIl BRUTALISTA MODULAR (U + P + M FUSION) -->
  <g id="symbol-brutalist-stencil" transform="translate(90, 110)">
    <!-- Container de Placa de Concreto Industrial -->
    <rect x="0" y="0" width="350" height="350" fill="#1C1B19" stroke="#36322D" stroke-width="2"/>
    
    <!-- Parafusos / Rebites Industriais nos Cantos -->
    <circle cx="16" cy="16" r="3" fill="#66625C"/>
    <circle cx="334" cy="16" r="3" fill="#66625C"/>
    <circle cx="16" cy="334" r="3" fill="#66625C"/>
    <circle cx="334" cy="334" r="3" fill="#66625C"/>

    <!-- Módulo 1 (Topo Esquerdo): Letra "U" em blocos segmentados estêncil (Branco Titânio) -->
    <path d="M40,50 H90 V140 C90,155 102,166 118,166 C134,166 146,155 146,140 V50 H196 V140 C196,182 162,216 118,216 C74,216 40,182 40,140 Z" fill="#EDE8E1"/>

    <!-- Fendas de Estêncil / Cortes Técnicos no "U" -->
    <rect x="36" y="100" width="164" height="8" fill="#1C1B19"/>

    <!-- Módulo 2 (Direita): Letra "P" em Amarelo Solar (#FFB800) e Terracota (#FF5722) -->
    <path d="M196,50 H270 C298,50 316,68 316,96 C316,124 298,142 270,142 H226 V216 H176 V50 H196 Z" fill="#FFB800"/>
    <!-- Contraforma cortada do P -->
    <rect x="226" y="78" width="46" height="36" fill="#1C1B19"/>
    <!-- Fenda de estêncil no P -->
    <rect x="170" y="100" width="150" height="8" fill="#1C1B19"/>

    <!-- Módulo 3 (Base): "M / M" e Padrão de Arte Urbana em Faixa de Alerta / Demarcação -->
    <!-- Faixa diagonal estilo "Tape de Isolamento / Asfalto em Obras" -->
    <g transform="translate(40, 240)">
      <rect x="0" y="0" width="270" height="46" fill="#FF5722"/>
      <!-- Padrão gráfico de dentes de serra / chevron urbano -->
      <polygon points="0,0 20,0 0,46" fill="#1C1B19"/>
      <polygon points="35,0 75,0 35,46" fill="#1C1B19"/>
      <polygon points="90,0 130,0 90,46" fill="#1C1B19"/>
      <polygon points="145,0 185,0 145,46" fill="#1C1B19"/>
      <polygon points="200,0 240,0 200,46" fill="#1C1B19"/>
      <polygon points="255,0 270,0 255,46" fill="#1C1B19"/>
      <!-- Texto vazado em Ciano sobreposto -->
      <text x="135" y="30" text-anchor="middle" fill="#EDE8E1" class="txt-stencil" font-size="16">REMIX CULTURAL</text>
    </g>

    <!-- Indicador Lateral de Spray / Stencil Cap -->
    <circle cx="48" cy="316" r="6" fill="#00E5FF"/>
    <text x="64" y="320" fill="#00E5FF" class="txt-mono" font-size="9">CAP_94 // 400ML GRAFFITI</text>
    <text x="310" y="320" text-anchor="end" fill="#66625C" class="txt-mono" font-size="9">SPO_ZONE LESTE/SUL</text>
  </g>

  <!-- LADO DIREITO: TIPOGRAFIA EDITORIAL BRUTALISTA STREETWEAR -->
  <g id="type-brutalist-stencil" transform="translate(490, 110)">
    <!-- Tag de Categoria -->
    <rect x="0" y="0" width="190" height="24" rx="2" fill="#242220"/>
    <rect x="0" y="0" width="4" height="24" fill="#FF5722"/>
    <text x="14" y="16" fill="#FF5722" class="txt-mono" font-size="10">VARIAÇÃO 03 // BRUTALIST STENCIL</text>

    <!-- Wordmark Principal com Letras Cortadas / Estêncil Modular -->
    <g transform="translate(0, 40)">
      <text x="0" y="86" fill="#EDE8E1" class="txt-stencil" font-size="92">U.P.M.M</text>
      <!-- Linha de corte estêncil horizontal vazando pela palavra -->
      <line x1="0" y1="46" x2="440" y2="46" stroke="#11100F" stroke-width="4"/>
    </g>

    <!-- Sub-título e Território -->
    <text x="0" y="174" fill="#FF5722" class="txt-sub" font-size="19">PERIFERIA MURAL &amp; MOVIMENTO</text>
    <text x="0" y="200" fill="#FFB800" class="txt-sub" font-size="13" letter-spacing="0.12em">ESTÉTICA URBANA DE ALTO IMPACTO MATE</text>

    <!-- Manifesto / Explicação de Design -->
    <text x="0" y="238" fill="#9E9991" class="txt-desc" font-size="14">
      Inspirado na sinalização pública de concreto, tipografia de estêncil de latas
      de tinta spray e na cultura brutalista do skate e streetwear brasileiro.
      Transmite força comunitária, ocupação de território e peso visual marcante.
    </text>

    <!-- Destaques das Cores e Aplicações em Produtos -->
    <g transform="translate(0, 300)">
      <!-- Aplicação 1: Murais -->
      <rect x="0" y="0" width="140" height="58" rx="3" fill="#1C1B19" stroke="#36322D"/>
      <text x="12" y="22" fill="#FF5722" class="txt-mono" font-size="9">01 // MURAL</text>
      <text x="12" y="44" fill="#EDE8E1" class="txt-heavy" font-size="13">Grandes Empenas</text>

      <!-- Aplicação 2: Streetwear -->
      <rect x="150" y="0" width="140" height="58" rx="3" fill="#1C1B19" stroke="#36322D"/>
      <text x="162" y="22" fill="#FFB800" class="txt-mono" font-size="9">02 // WEAR</text>
      <text x="162" y="44" fill="#EDE8E1" class="txt-heavy" font-size="13">Estamparia Silk</text>

      <!-- Aplicação 3: App UI -->
      <rect x="300" y="0" width="140" height="58" rx="3" fill="#1C1B19" stroke="#36322D"/>
      <text x="312" y="22" fill="#00E5FF" class="txt-mono" font-size="9">03 // APP_ICON</text>
      <text x="312" y="44" fill="#EDE8E1" class="txt-heavy" font-size="13">Favicon &amp; Badge</text>
    </g>
  </g>

  <!-- Rodapé Técnico -->
  <g transform="translate(60, 560)">
    <text x="0" y="0" fill="#66625C" class="txt-mono" font-size="10">UPMM PERIFA LAB // OPTION C: BRUTALIST MURAL &amp; STENCIL SYSTEM</text>
    <text x="880" y="0" text-anchor="end" fill="#66625C" class="txt-mono" font-size="10">REMIX CULTURAL // BAUHAUS STREETWEAR</text>
  </g>
</svg>
